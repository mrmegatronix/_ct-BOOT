<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autonomous Kiosk Display</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Top Bar -->
    <header class="kiosk-header">
        <div class="kiosk-title">SYSTEM MONITOR &amp; DIGITAL SIGNAGE</div>
        <div class="kiosk-clock" id="kiosk-clock">00<span class="colon-blink">:</span>00<span class="colon-blink">:</span>00</div>
        <div class="status-badge live" id="status-badge">LIVE (10s)</div>
    </header>

    <!-- Slide Viewport -->
    <main class="kiosk-viewport">
        <!-- Module A: _ct-MATRIX -->
        <section class="slide active" data-module="matrix" style="padding: 0; width: 100%; height: 100%;">
            <iframe src="https://mrmegatronix.github.io/_ct-MATRIX/" style="width: 100%; height: 100%; border: none; overflow: hidden; display: block;" title="_ct-MATRIX"></iframe>
        </section>

        <!-- Module B: Weather (ct-wea1) -->
        <section class="slide" data-module="weather" style="padding: 0; width: 100%; height: 100%;">
            <iframe src="weather.html" style="width: 100%; height: 100%; border: none; overflow: hidden; display: block;" title="Christchurch Weather Display (ct-wea1)"></iframe>
        </section>

        <!-- Progress Bar Indicator -->
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </main>

    <!-- Footer Controls Bar -->
    <footer class="kiosk-footer">
        <div class="footer-nav-help">
            <span><span class="key-tag">&larr;</span> / <span class="key-tag">&rarr;</span> Prev / Next</span>
            <span><span class="key-tag">&uarr;</span> Restart Module</span>
            <span><span class="key-tag">&darr;</span> Next Module</span>
            <span><span class="key-tag">SPACE</span> Pause</span>
            <span><span class="key-tag">M</span> No Limit</span>
            <span><span class="key-tag">C</span> Banners</span>
            <span><span class="key-tag">0</span> Lock</span>
            <span><span class="key-tag">1-9</span> Duration (10s-90s)</span>
        </div>
        <div class="footer-shortcuts">
            <span><span class="key-tag">T</span> Terminal</span>
            <span><span class="key-tag">A</span> Admin</span>
            <span><span class="key-tag">R</span> Remote</span>
        </div>
    </footer>

    <script src="js/kiosk-controller.js"></script>
</body>
</html>

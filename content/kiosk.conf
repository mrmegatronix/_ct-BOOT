# Kiosk Configuration & Display Initializer
# Enforces clean single-screen 1080p display and prevents desktop splitting / tiling

if command -v xrandr >/dev/null 2>&1 && [ -n "${DISPLAY:-}" ]; then
    # Disable all disconnected outputs that Xorg may think are active
    xrandr -q 2>/dev/null | grep " disconnected" | awk '{print $1}' | while read -r disc; do
        [ -n "$disc" ] && xrandr --output "$disc" --off 2>/dev/null || true
    done

    # Detect active connected display output
    CONNECTED_OUTPUTS=$(xrandr -q 2>/dev/null | grep " connected" | awk '{print $1}')
    PRIMARY_OUTPUT=$(echo "$CONNECTED_OUTPUTS" | head -n 1)

    # Turn off secondary outputs to guarantee single physical screen display
    for out in $(echo "$CONNECTED_OUTPUTS" | tail -n +2); do
        [ -n "$out" ] && xrandr --output "$out" --off 2>/dev/null || true
    done

    if [ -n "$PRIMARY_OUTPUT" ]; then
        # Ensure 1920x1080 mode exists in X server
        if ! xrandr -q 2>/dev/null | grep -A 25 "^$PRIMARY_OUTPUT" | grep -q "1920x1080"; then
            xrandr --newmode "1920x1080_60.00" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync 2>/dev/null || true
            xrandr --addmode "$PRIMARY_OUTPUT" "1920x1080_60.00" 2>/dev/null || true
        fi
        if ! xrandr --output "$PRIMARY_OUTPUT" --mode 1920x1080 --pos 0x0 --rate 60 2>/dev/null; then
            if ! xrandr --output "$PRIMARY_OUTPUT" --mode 1920x1080 --pos 0x0 2>/dev/null; then
                if ! xrandr --output "$PRIMARY_OUTPUT" --mode "1920x1080_60.00" --pos 0x0 2>/dev/null; then
                    xrandr --output "$PRIMARY_OUTPUT" --auto --pos 0x0 2>/dev/null || true
                    xrandr --output "$PRIMARY_OUTPUT" --scale-from 1920x1080 2>/dev/null || true
                fi
            fi
        fi
        xrandr --output "$PRIMARY_OUTPUT" --primary --pos 0x0 2>/dev/null || true
    else
        xrandr -s 1920x1080 2>/dev/null || true
    fi
    xrandr --fb 1920x1080 2>/dev/null || true
fi

# Optional custom target URL override:
# TARGET_URL="http://127.0.0.1:8080/index.html"

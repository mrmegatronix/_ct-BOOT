# Kiosk Configuration & Display Initializer
# Enforces clean single-screen 1080p display and prevents desktop splitting / tiling

if command -v xrandr >/dev/null 2>&1 && [ -n "${DISPLAY:-}" ]; then
    # Disable all disconnected outputs that Xorg may think are active
    xrandr -q 2>/dev/null | grep " disconnected" | awk '{print $1}' | while read -r disc; do
        xrandr --output "$disc" --off 2>/dev/null || true
    done

    # Detect active connected display output
    CONNECTED_OUTPUTS=$(xrandr -q 2>/dev/null | grep " connected" | awk '{print $1}')
    PRIMARY_OUTPUT=$(echo "$CONNECTED_OUTPUTS" | head -n 1)

    # Turn off secondary outputs to guarantee single physical screen display
    for out in $(echo "$CONNECTED_OUTPUTS" | tail -n +2); do
        xrandr --output "$out" --off 2>/dev/null || true
    done

    if [ -n "$PRIMARY_OUTPUT" ]; then
        # Force 1920x1080 primary output mode with 0x0 origin
        if xrandr -q 2>/dev/null | grep -A 15 "^$PRIMARY_OUTPUT" | grep -q "1920x1080"; then
            xrandr --output "$PRIMARY_OUTPUT" --mode 1920x1080 --pos 0x0 --rate 60 2>/dev/null || \
            xrandr --output "$PRIMARY_OUTPUT" --mode 1920x1080 --pos 0x0 2>/dev/null || true
        else
            xrandr --output "$PRIMARY_OUTPUT" --auto --pos 0x0 2>/dev/null || true
        fi
        xrandr --output "$PRIMARY_OUTPUT" --primary 2>/dev/null || true
    fi
    xrandr --fb 1920x1080 2>/dev/null || true
fi

# Optional custom target URL override:
# TARGET_URL="http://127.0.0.1:8080/index.html"

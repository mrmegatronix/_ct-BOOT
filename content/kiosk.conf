# Kiosk Configuration & Display Initializer
# Enforces clean single-screen 1080p display and prevents desktop splitting / tiling

if command -v xrandr >/dev/null 2>&1 && [ -n "${DISPLAY:-}" ]; then
    # Detect all connected display outputs
    CONNECTED_OUTPUTS=$(xrandr -q 2>/dev/null | grep " connected" | awk '{print $1}')
    PRIMARY_OUTPUT=$(echo "$CONNECTED_OUTPUTS" | head -n 1)

    # Disable secondary/phantom outputs to prevent desktop spanning/split-screen
    for out in $(echo "$CONNECTED_OUTPUTS" | tail -n +2); do
        xrandr --output "$out" --off 2>/dev/null || true
    done

    # Set primary output to native or 1920x1080
    if [ -n "$PRIMARY_OUTPUT" ]; then
        xrandr --output "$PRIMARY_OUTPUT" --auto 2>/dev/null || true
        if xrandr -q 2>/dev/null | grep -A 10 "^$PRIMARY_OUTPUT" | grep -q "1920x1080"; then
            xrandr --output "$PRIMARY_OUTPUT" --mode 1920x1080 --rate 60 2>/dev/null || \
            xrandr --output "$PRIMARY_OUTPUT" --mode 1920x1080 2>/dev/null || true
        fi
    fi
fi


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>Kiosk Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container {
            width: 100%;
            max-width: 1200px;
            margin: 40px auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-row label {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-blue);
            white-space: nowrap;
        }
        input, select, textarea {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #ffffff;
            font-size: 18px;
            padding: 12px 16px;
            border-radius: 8px;
            outline: none;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-blue);
        }
        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }
        .btn {
            background: var(--accent-blue);
            color: #0b0f19;
            font-weight: 700;
            font-size: 16px;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <header class="kiosk-header">
        <div class="kiosk-title">ADMIN CONTROL CENTER</div>
        <div class="kiosk-clock" id="kiosk-clock">00<span class="colon-blink">:</span>00<span class="colon-blink">:</span>00</div>
        <div class="status-badge live">AUTHENTICATED</div>
    </header>

    <div class="admin-container">
        <div class="form-row">
            <label for="kiosk-url">Target Display URL / Path</label>
            <input type="text" id="kiosk-url" value="http://localhost:8080/index.html">
        </div>
        <div class="form-row">
            <label for="default-duration">Default Slide Duration</label>
            <select id="default-duration">
                <option value="0">No Time Limit (Manual Advance Only)</option>
                <option value="10" selected>10 Seconds</option>
                <option value="20">20 Seconds</option>
                <option value="30">30 Seconds</option>
                <option value="60">60 Seconds</option>
                <option value="90">90 Seconds</option>
            </select>
        </div>
        <div class="form-row">
            <label for="slide-urls">Slide URLs / Web Pages (One per line)</label>
            <textarea id="slide-urls" rows="6" placeholder="weather.html&#10;https://your-dashboard.com&#10;https://news.example.com"></textarea>
            <small style="color:var(--text-muted);font-size:14px;margin-top:4px;">
                Enter URLs to display as rotating slides (e.g. <code>weather.html</code>, <code>https://...</code>). Leave empty to display built-in default modules.
            </small>
        </div>
        <div class="form-row">
            <label for="custom-css">Custom CSS Injections</label>
            <textarea id="custom-css" rows="3" placeholder="/* Custom styling overrides */"></textarea>
        </div>
        <div class="btn-group">
            <button class="btn" onclick="saveSettings()">Save Changes</button>
            <button class="btn" style="background:#334155;color:#fff;" onclick="window.close()">Close Admin</button>
        </div>

        <hr style="border:none;border-top:1px solid var(--border-color);margin:24px 0 16px 0;">

        <!-- Computer & Hardware Control Section -->
        <h3 style="color:var(--accent-blue);font-size:22px;">COMPUTER &amp; HARDWARE CONTROLS</h3>
        <div id="telemetry-bar" style="display:grid;grid-template-columns:repeat(4, 1fr);gap:16px;background:#0f172a;padding:16px;border-radius:8px;border:1px solid var(--border-color);font-size:15px;">
            <div><strong>Host:</strong> <span id="stat-host">Loading...</span></div>
            <div><strong>IP Address:</strong> <span id="stat-ip">Loading...</span></div>
            <div><strong>Uptime:</strong> <span id="stat-uptime">Loading...</span></div>
            <div><strong>Memory:</strong> <span id="stat-ram">Loading...</span></div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:16px;margin-top:12px;">
            <button class="btn" style="background:#1e293b;color:#fff;border:1px solid var(--border-color);" onclick="sysAction('/api/system/restart-browser')">&#8635; Restart Browser</button>
            <button class="btn" style="background:#1e293b;color:#fff;border:1px solid var(--border-color);" onclick="sysAction('/api/system/screen-off')">&#9790; Screen Sleep (DPMS Off)</button>
            <button class="btn" style="background:#1e293b;color:#fff;border:1px solid var(--border-color);" onclick="sysAction('/api/system/screen-on')">&#9788; Screen Wake (DPMS On)</button>
            <button class="btn" style="background:#1e293b;color:#fff;border:1px solid var(--border-color);" onclick="sysAction('/api/system/rotate?dir=normal')">&#8634; Rotate Landscape (Normal)</button>
            <button class="btn" style="background:#1e293b;color:#fff;border:1px solid var(--border-color);" onclick="sysAction('/api/system/rotate?dir=right')">&#8635; Rotate Portrait (90°)</button>
            <button class="btn" style="background:#1e293b;color:#fff;border:1px solid var(--border-color);" onclick="sysAction('/api/system/volume?action=toggle')">&#128266; Mute / Unmute Audio</button>
            <button class="btn" style="background:#d97706;color:#0b0f19;" onclick="if(confirm('Reboot this computer now?')) sysAction('/api/system/reboot')">&#9888; Reboot Computer</button>
            <button class="btn" style="background:#dc2626;color:#ffffff;" onclick="if(confirm('Power off this computer now?')) sysAction('/api/system/poweroff')">&#9211; Shutdown / Power Off</button>
        </div>
    </div>

    <script>
        const durationSelect = document.getElementById('default-duration');
        const urlsTextarea = document.getElementById('slide-urls');
        const savedDur = localStorage.getItem('kiosk_duration');
        const savedUrls = localStorage.getItem('kiosk_slide_urls');

        if (savedDur !== null) {
            durationSelect.value = savedDur;
        }
        if (savedUrls !== null) {
            urlsTextarea.value = savedUrls;
        }

        function saveSettings() {
            localStorage.setItem('kiosk_duration', durationSelect.value);
            localStorage.setItem('kiosk_slide_urls', urlsTextarea.value.trim());
            alert('Settings saved. Kiosk slides updated.');
        }

        function sysAction(endpoint) {
            fetch(endpoint, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    alert(data.message || 'Action sent successfully');
                })
                .catch(err => {
                    alert('System command error: ' + err);
                });
        }

        function fetchTelemetry() {
            fetch('/api/system/stats')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('stat-host').textContent = data.hostname || 'Unknown';
                    document.getElementById('stat-ip').textContent = data.ip || 'Unknown';
                    document.getElementById('stat-uptime').textContent = data.uptime || 'Unknown';
                    document.getElementById('stat-ram').textContent = data.memory || 'Unknown';
                })
                .catch(() => {
                    document.getElementById('stat-host').textContent = 'Kiosk Host';
                    document.getElementById('stat-ip').textContent = window.location.hostname;
                    document.getElementById('stat-uptime').textContent = 'Active';
                    document.getElementById('stat-ram').textContent = 'Online';
                });
        }
        fetchTelemetry();
        setInterval(fetchTelemetry, 10000);

        const clock = document.getElementById('kiosk-clock');
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            clock.innerHTML = `${h}<span class="colon-blink">:</span>${m}<span class="colon-blink">:</span>${s}`;
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
